id = "vuka"
name = "Vuka"
version = "0.2.0"
schema_version = 1
authors = ["Paul Manoni <01paulmanoni@gmail.com>"]
description = "Vuka for Zed: .vuka and .vuka.html highlighting from Vuka's own grammars, and completion, hover, go-to-definition, rename, diagnostics and formatting from `vuka lsp`."
repository = "https://github.com/vuka-lang/vuka"

snippets = ["snippets/vuka.json", "snippets/vuka html.json"]

capabilities = [
  { kind = "process:exec", command = "*", args = ["version"] },
  { kind = "npm:install", package = "typescript-language-server" },
  { kind = "npm:install", package = "typescript" },
]

[grammars.vuka]
repository = "https://github.com/vuka-lang/vuka"
rev = "ecada622f465fa2e15dcdbc8d6cc0da3a67336fc"
path = "grammars/tree-sitter-vuka/vuka"

[grammars.vuka_html]
repository = "https://github.com/vuka-lang/vuka"
rev = "ecada622f465fa2e15dcdbc8d6cc0da3a67336fc"
path = "grammars/tree-sitter-vuka/vuka_html"

[language_servers.vuka]
name = "Vuka"
languages = ["Vuka", "Vuka HTML"]

[language_servers.vuka.language_ids]
"Vuka" = "vuka"
"Vuka HTML" = "vuka-html"
