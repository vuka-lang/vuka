id = "vuka"
name = "Vuka"
version = "0.1.0"
schema_version = 1
authors = ["Paul Manoni <01paulmanoni@gmail.com>"]
description = "Vuka for Zed: highlighting for .vuka and .vuka.html, and full language intelligence (completion, hover, go-to-definition, rename, diagnostics) through `vuka lsp`, which runs gopls with Vuka's additions to Go."
repository = "https://github.com/vuka-lang/vuka"

# The language server is `vuka lsp` (gopls behind a proxy). The extension locates
# the `vuka` binary on PATH (or a configured path) and launches it with `lsp`.
[language_servers.vuka]
name = "Vuka"
languages = ["Vuka", "Vuka HTML"]

# Highlighting: the Vuka language uses Zed's built-in `go` grammar
# (languages/vuka/config.toml sets grammar = "go"), since .vuka is a Go
# superset — no [grammars] block needed, and the queries in languages/vuka/
# (highlights/injections/outline) are written against tree-sitter-go.
# tree-sitter-go's error recovery keeps coloring working across the Vuka-only
# constructs (JSX, @decorators, match, enums, field attributes). A dedicated
# `tree-sitter-vuka` grammar could later highlight those precisely.
#
# Intelligence is `vuka lsp` (gopls behind a proxy): completion, hover,
# go-to-definition, rename, diagnostics.
