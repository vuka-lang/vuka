name = "Vuka"
grammar = "vuka"
path_suffixes = ["vuka"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 1 }
documentation_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
autoclose_before = ";:.,=}])>< \n\t"
word_characters = ["_"]
tab_size = 4
hard_tabs = true
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "<", end = ">", close = false, newline = false, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["comment", "string"] },
]
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
scope_opt_in_language_servers = ["tailwindcss-language-server"]

[jsx_tag_auto_close]
open_tag_node_name = "markup_start_tag"
close_tag_node_name = "markup_end_tag"
jsx_element_node_name = "markup_element"
tag_name_node_name = "tag_name"

[overrides.element]
line_comments = { remove = true }
block_comment = { start = "{/*", prefix = "", end = "*/}", tab_size = 1 }

[overrides.string]
completion_query_characters = ["-"]
opt_into_language_servers = ["tailwindcss-language-server"]
