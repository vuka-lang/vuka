package main

// Page fills the slots of function components: a props struct's field,
// and a parameter.
type Page struct{ Items []string }
<main>
  n := len(Items)
  <Panel title="Items">
    <slot:header><b>{n} items</b></slot:header>
    for _, it := range Items {
      <p>{it}</p>
    }
  </Panel>
  <Frame title="F"><slot:header><i>h</i></slot:header>body</Frame>
</main>
