package main

// Chart is a component with a script: its data fields are its props.
type Chart struct {
	Title  string
	Points []int
	Zoom   func(from, to int)
}
<figure class="chart">
  <figcaption>{Title}</figcaption>
  <script is:inline>window.points = {json(Points)};</script>
</figure>

<script lang="ts">
import { component } from 'vuka:component'
export default component<Chart>((el, props) => ({ update(next) { el.dataset.n = String(next.Points.length) } }))
</script>

<style scoped>
figcaption { font-weight: bold }
</style>
