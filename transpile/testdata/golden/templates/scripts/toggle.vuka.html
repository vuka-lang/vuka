package main

import "github.com/vuka-lang/ui/v2"

// Toggle's script reads its state.
type Toggle struct {
	open ui.State[bool]
}
<button type="button">toggle</button>

<script lang="ts">
import { component } from 'vuka:component'
export default component<Toggle>((el, props, ctx) => {
  el.onclick = () => ctx.state("open").set(!ctx.state("open").get())
})
</script>
