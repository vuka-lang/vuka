package main

import "github.com/vuka-lang/ui/v2"

// Counter is a live component.
type Counter struct {
	ui.Live
	Start int
	n     int
}

func (c *Counter) Inc() { c.n++ }

// Add is an event taking an argument: onClick={Add(2)}.
func (c *Counter) Add(n int) { c.n += n }
<div class="counter">
  <Badge label="count" />
  <span>{Start + n}</span>
  <button onClick={Inc}>+</button>
  <button onClick={Add(2)}>+2</button>
</div>
