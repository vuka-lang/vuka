package main

import "github.com/vuka-lang/ui/v2"

// Admin is the admin pages' layout: its title, Children and the Actions
// slot; it reads the user from ctx.
type Admin struct {
	Title    string
	Actions  ui.Node
	Children ui.Node
}
<div class="admin">
  <header><h1>{Title}</h1>{Actions}<span>{ctx.Value(userKey{}).(string)}</span></header>
  <main>{Children}</main>
</div>
