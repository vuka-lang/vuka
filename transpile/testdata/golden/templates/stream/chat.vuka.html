<script lang="go">
package main

import (
	"context"

	"github.com/vuka-lang/ui/v2"
	"vukatest.local/streamui"
)

type Message struct {
	ID   int64
	Text string
}

// Chat's messages are a stream: its container's loop lowers to the
// stream's block of rows, its attributes on the container.
type Chat struct {
	ui.Live
	Room     string
	messages streamui.Stream[Message]
	typing   bool
}

func (c *Chat) Remove(id int64) { c.messages.Delete(id) }

// Keep keeps the last 200 messages, whichever end a batch inserts at.
func (c *Chat) Keep() { c.messages.Limit(200).TrimStart() }

// Older and Newer load at the container's edges: each takes the key of the
// edge row the browser holds.
func (c *Chat) Older(first int64) { c.messages.InsertAt(0, Message{ID: first - 1}) }

func (c *Chat) Newer(ctx context.Context, last string) error { return nil }
</script>

<section>
  <h2>#{Room}</h2>
  <ul class="log" id="log" onViewportTop={Older} onViewportBottom={Newer}>
    for _, m := range messages.Rows() {
      <li key={m.ID}>
        <b>{m.Text}</b>
        <button onClick={ui.JS.Push(Remove, m.ID)}>Delete</button>
      </li>
    }
  </ul>
  if typing {
    <p>typing…</p>
  }
</section>
