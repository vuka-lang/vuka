package main

// Page lists the orders below a week of sales.
type Page struct{ Orders []Order }
<main>
  <Sales title="Week" week={[]int{3, 12}}>
    <em>note</em>
  </Sales>
  if len(Orders) == 0 {
    <p>none</p>
  } else {
    <ul>
      for _, o := range Orders {
        <Row o={o}/>
      }
    </ul>
  }
  n := len(Orders)
  switch n {
  case 1:
    <p>one</p>
  default:
    <p>{n} orders</p>
  }
</main>
