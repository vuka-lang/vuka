package main

import (
	"context"

	"github.com/vuka-lang/ui/v2"
)

// Box counts its items when it mounts: one hook, per instantiation.
type Box[T any] struct {
	ui.Live
	Items []T
	n     int
}

@ui.Mount
func (b *Box[T]) mount(ctx context.Context) error {
	b.n = len(b.Items)
	return nil
}
