package main

import (
	ui "vukatest.local/stateui"
)

// Gate's Check reads its Show prop in Go: a state handed to it is the same
// state, so the parent's classifies synced through the edge.
type Gate struct {
	ui.Live
	Show ui.State[bool]
}

func (g *Gate) Check() {
	if g.Show {
		return
	}
}
<button onClick={Check}>check</button>
