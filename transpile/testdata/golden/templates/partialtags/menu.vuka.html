package main

// Menu is the top bar: a link per item, the current one marked.
type Menu struct {
	Items []Item
	Path  string
}
<nav>
  for _, i := range Items {
    <NavLink item={i} on={i.Href == Path}/>
  }
  <Panel title="Me">
    <slot:footer><badge n={3}/></slot:footer>
    <Who/>
  </Panel>
  <NavLink item={Item{"/x", "X"}} on/>
  {NavLink{Item: Item{"/y", "Y"}}}
</nav>
