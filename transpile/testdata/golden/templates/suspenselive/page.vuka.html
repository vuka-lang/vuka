<script lang="go">
package main

import (
	"context"
	"errors"

	ui "vukatest.local/stateui"
)

// Dashboard's boundaries wait for its deferred groups.
type Dashboard struct {
	ui.Live
	tiles []string @ui.Defer("stats")
	tabs  []string @ui.Defer("board")
	notes string   @ui.Defer("notes")
}

@ui.Loads("stats")
func (d *Dashboard) loadStats(ctx context.Context) error {
	d.tiles = []string{"Vacancies", "Posts"}
	return nil
}

@ui.Loads("board")
func (d *Dashboard) loadBoard(ctx context.Context) error {
	d.tabs = []string{"Letters"}
	return nil
}

@ui.Loads("notes")
func (d *Dashboard) loadNotes(ctx context.Context) error { return errors.New("notes are down") }
</script>

<main>
  <ui.Suspense for={tiles, tabs}>
    <slot:fallback><i>loading</i></slot:fallback>
    <slot:error><b role="alert">Couldn't load the dashboard.</b></slot:error>
    for _, t := range tiles {
      <p>{t}</p>
    }
    <p>{len(tabs)} tabs</p>
  </ui.Suspense>
  <ui.Suspense>
    <slot:fallback><i>loading notes</i></slot:fallback>
    <slot:error><b role="alert">No notes.</b></slot:error>
    <p>{notes}</p>
  </ui.Suspense>
</main>
