package main

import (
	"context"

	"github.com/vuka-lang/ui/v2"
)

// Counter counts clicks.
type Counter struct {
	ui.Live
	Start int // a prop
	n     int // state the server keeps
}

@ui.Mount
func (c *Counter) mount(ctx context.Context) error { c.n = c.Start; return nil }

func (c *Counter) Inc() { c.n++ }
<button onClick={Inc}>{n}</button>
