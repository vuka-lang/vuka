<script lang="go">
package pages

import (
	"context"

	"github.com/vuka-lang/ui/v2"
)

// Layout is the document of every page: the outermost layout, in pages/.
type Layout struct {
	Children ui.Node
}

// Title is the page's title, which the page names with its Title method.
func (l Layout) Title(ctx context.Context) string {
	if t := ui.PageTitle(ctx); t != "" {
		return t + " - HR"
	}
	return "HR"
}
</script>

<html lang="en">
<head><meta charset="utf-8"/><title>{Title(ctx)}</title></head>
<body>
  <nav id="site" data-path={request.Path}><a href={route("employers")}>Employers</a> <a href={route("files", "handbook/leave.txt")}>Handbook</a> <a href={route("about")}>About</a> <a href={route("app.settings")}>App</a></nav>
  <main>{Children}</main>
</body>
</html>
