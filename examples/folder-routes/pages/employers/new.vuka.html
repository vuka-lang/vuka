<script lang="go">
package employers

import (
	"context"

	"example.com/folder-routes/pages/private_parts"
	"example.com/folder-routes/store"
	"github.com/vuka-lang/ui/v2"
	"github.com/vuka-lang/web/v2"
)

// New is the form adding an employer: GET /employers/new, and its Post
// method POST /employers/new. It has no constructor: route.go builds it,
// and its store, an unexported field of a type the app provides, is
// injected for the page and for its Post.
type New struct {
	ui.Live
	store *store.Store
	count int
}

@ui.Mount
func (p *New) mount(ctx context.Context) error {
	p.count = len(p.store.Employers())
	return nil
}

func (p *New) Title() string { return "New employer" }

func (p *New) Post(ctx context.Context, form store.EmployerForm) (web.Redirect, error) {
	e := p.store.AddEmployer(form)
	return web.Redirect(route("employers.employer", e.ID)), nil
}
</script>

<section id="new">
  <h1>New employer</h1>
  {parts.TallyOf("employers so far", count)}
  <form method="post" action={route("employers.new")}>
    <label>Name <input name="name" required/></label>
    <label>City <input name="city" required/></label>
    <button>Add</button>
  </form>
</section>
