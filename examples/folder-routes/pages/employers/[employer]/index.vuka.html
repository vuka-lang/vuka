<script lang="go">
package employer

import (
	"context"
	"fmt"

	"example.com/folder-routes/store"
	"github.com/vuka-lang/web/v2"
)

// Index is an employer's overview, a stateless page: GET
// /employers/{employer}. It reads the employer where it shows it; the
// layout has answered 404 for one that isn't there.
type Index struct {
	Employer int
	db       *store.Store
}

func NewIndex(s *store.Store) *Index { return &Index{db: s} }

func (p *Index) Title() string {
	e, _ := p.db.Employer(p.Employer)
	return e.Name
}

func (p *Index) contract(ctx context.Context) string {
	return route("files", web.Rest(fmt.Sprintf("contracts/%d.txt", p.Employer)))
}
</script>

<section id="overview">
  <h2>Permits</h2>
  <ul id="permits">
    for _, pm := range db.Permits(Employer) {
      <li><a href={route("employers.permits", Employer, pm.ID)}>{pm.Kind}</a></li>
    }
  </ul>
  <a id="contract" href={contract(ctx)}>Contract</a>
  <a id="api" href={route("api.employers.employer", Employer)}>As JSON</a>
</section>
