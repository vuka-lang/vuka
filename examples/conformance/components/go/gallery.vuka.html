import "strings"

<Shell title="Gallery">
  <slot:aside>
    <p>{len(items)} items</p>
    <button onClick={Widen}>Widen</button>
    <button onClick={Drop}>Drop</button>
  </slot:aside>
  for _, it := range items {
    <div key={it.ID} class="item">
      <Card title={it.Name} accent={accent(it)} wide={wide}>
        {tags(it.Tags)}
        <Counter key={it.ID} label={strings.ToLower(it.Name)}/>
        <slot:footer>
          <button class:on={it.Liked} onClick={Like(it.ID)}>{likeText(it.Liked)}</button>
        </slot:footer>
      </Card>
    </div>
  }
</Shell>

// tags is a partial: the item's tags, or a dash.
func tags(ts []string)
if len(ts) == 0 {
  <p class="tags">—</p>
} else {
  <ul class="tags">
    for _, t := range ts {
      <li key={t}>{t}</li>
    }
  </ul>
}
