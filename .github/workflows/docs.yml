name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "editors/vscode/syntaxes/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "editors/vscode/syntaxes/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build

  # The site is served from vuka-lang.github.io, whose workflow builds these
  # docs. This repository's Pages only forwards the old /vuka/... addresses.
  redirect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Vuka</title>
          <link rel="canonical" href="https://vuka-lang.github.io/">
          <meta http-equiv="refresh" content="0; url=https://vuka-lang.github.io/">
          <script>location.replace('https://vuka-lang.github.io' + location.pathname.replace(/^\/vuka(?=\/|$)/, '') + location.search + location.hash)</script>
          <p>The Vuka docs moved to <a href="https://vuka-lang.github.io/">vuka-lang.github.io</a>.</p>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: redirect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
