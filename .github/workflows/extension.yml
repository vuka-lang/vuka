name: Extension

# Publishes the VS Code extension when a vscode-vX.Y.Z tag is pushed, or by
# hand. Open VSX needs the OVSX_PAT secret; the VS Code Marketplace step runs
# only when VSCE_PAT is set. Without either, the run still builds and keeps the
# .vsix as an artifact.
on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - name: The tag names the package's version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          want="${GITHUB_REF_NAME#vscode-v}"
          have="$(node -p 'require("./package.json").version')"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME, package.json $have"; exit 1; }
      - run: npx vsce package -o vuka.vsix
      - uses: actions/upload-artifact@v5
        with:
          name: vuka-vsix
          path: editors/vscode/vuka.vsix
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.1 publish vuka.vsix -p "$OVSX_PAT"
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath vuka.vsix -p "$VSCE_PAT"
