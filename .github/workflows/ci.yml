name: CI

# A branch's pushes run nothing: its pull request runs CI once. main and
# tags run on push.
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: stable
  GOPLS_VERSION: v0.24.0
  TEMPL_VERSION: v0.3.1020
  TAILWIND_VERSION: v4.3.0

jobs:
  lib:
    name: vuka (vet, race tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            cmd/vuka/go.sum
            cmd/vukavet/go.sum
            transpile/testdata/golden/go.sum
      - name: gofmt
        run: |
          bad=$(git ls-files '*.go' | grep -v -e '/testdata/' -e '_vuka\.go$' -e '_vuka_test\.go$' | xargs gofmt -l)
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -timeout 25m ./...
      - name: vukavet
        working-directory: cmd/vukavet
        run: go vet ./... && go test ./...
      - name: transpile benchmark
        run: go test -run '^$' -bench BenchmarkGoldens -benchtime 10x -benchmem ./transpile
      - name: go install @main builds the commands
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOWORK: "off"
          GOFLAGS: -mod=readonly
        run: |
          for m in cmd/vuka cmd/vukavet; do
            (cd "$m" && go build -o /dev/null .) || {
              echo "::error::$m doesn't build against the vuka/v2 its go.mod requires, so 'go install …/$m/v2@main' fails: run 'go get github.com/vuka-lang/vuka/v2@$(git rev-parse HEAD)' in $m and push"
              exit 1
            }
          done

  # cmd/vuka's tests as an app meets them (Chrome, Vite, gopls, templ),
  # one job per group of .github/e2e-groups.txt, so a failure names its area.
  # citest retries the tests of .github/flaky.txt once, visibly.
  e2e:
    name: cmd/vuka ${{ matrix.group }} (${{ matrix.what }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: browser
            what: Chrome — islands, live pages, templ and ui libraries, GraphQL
          - group: lsp
            what: vuka lsp over gopls and templ
          - group: lsp-latency
            what: vuka lsp under load
          - group: build-watch
            what: vuka build, run -watch
          - group: new-upgrade
            what: vuka new, add, upgrade, release
          - group: conformance
            what: examples as Vuka and ejected
          - group: rest
            what: every other test
    env:
      VUKA_UI: ${{ github.workspace }}/vuka-ui
      VUKA_WEB: ${{ github.workspace }}/vuka-web
      VUKA_ORM: ${{ github.workspace }}/vuka-orm
      VUKA_NEW_REPLACE: github.com/vuka-lang/vuka/v2=${{ github.workspace }}/vuka,github.com/vuka-lang/ui/v2=${{ github.workspace }}/vuka-ui,github.com/vuka-lang/web/v2=${{ github.workspace }}/vuka-web,github.com/vuka-lang/orm/v2=${{ github.workspace }}/vuka-orm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vuka
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuka-lang/ui
          path: vuka-ui
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuka-lang/web
          path: vuka-web
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuka-lang/orm
          ref: 0baf7c839495ce48095ad8292876a4b679850f3a
          path: vuka-orm
      # A change made together with ui's, web's or orm's has a branch of the
      # same name there.
      - name: The ui, web and orm branches of this change, if any
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for r in vuka-ui vuka-web vuka-orm; do
            git -C $r fetch --depth=1 origin "$BRANCH" && git -C $r checkout FETCH_HEAD || true
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            vuka/cmd/vuka/go.sum
            vuka-ui/go.sum
            vuka-web/go.sum
            vuka-orm/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      # gopls, templ and tailwindcss at the pinned versions, and the e2e
      # node_modules for their lockfiles: built or fetched once, then cached.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/vuka-tools
          key: tools-${{ runner.os }}-${{ env.GO_VERSION }}-gopls-${{ env.GOPLS_VERSION }}-templ-${{ env.TEMPL_VERSION }}-tailwind-${{ env.TAILWIND_VERSION }}
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vuka/cmd/vuka/testdata/node/vite/node_modules
            vuka/cmd/vuka/testdata/node/islands/node_modules
          key: e2e-node-${{ runner.os }}-node22-${{ hashFiles('vuka/cmd/vuka/testdata/node/*/package-lock.json') }}
      - name: Tools
        env:
          CACHED: ${{ steps.tools.outputs.cache-hit }}
        run: |
          # Ubuntu 24.04 keeps unprivileged user namespaces from Chrome's sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "VUKA_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          bin="$HOME/.local/vuka-tools"
          if [ "$CACHED" != true ]; then
            mkdir -p "$bin"
            GOBIN="$bin" go install golang.org/x/tools/gopls@${GOPLS_VERSION}
            GOBIN="$bin" go install github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}
            curl -fsSL -o "$bin/tailwindcss" \
              "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
            chmod +x "$bin/tailwindcss"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: The e2e node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: vuka/cmd/vuka
        run: |
          npm ci --prefix testdata/node/vite --no-audit --no-fund
          npm ci --prefix testdata/node/islands --no-audit --no-fund
      - name: The command builds with this repository's compiler and the ui checkout
        working-directory: vuka/cmd/vuka
        run: go mod edit -replace github.com/vuka-lang/vuka/v2=../.. -replace github.com/vuka-lang/ui/v2=../../../vuka-ui
      - name: citest
        run: go build -C vuka -o "$RUNNER_TEMP/citest" ./.github/scripts/citest
      - name: vet, and every test in exactly one group
        if: matrix.group == 'rest'
        working-directory: vuka/cmd/vuka
        run: go vet ./... && "$RUNNER_TEMP/citest" check -- ./...
      - name: test
        working-directory: vuka/cmd/vuka
        run: >-
          "$RUNNER_TEMP/citest" run -group ${{ matrix.group }}
          -title "cmd/vuka ${{ matrix.group }}"
          -- -timeout 25m ./...

  windows:
    name: cmd/vuka on Windows (tests, vuka build, run --watch)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VUKA_UI: ${{ github.workspace }}\vuka-ui
      VUKA_WEB: ${{ github.workspace }}\vuka-web
      VUKA_ORM: ${{ github.workspace }}\vuka-orm
      VUKA_NEW_REPLACE: github.com/vuka-lang/vuka/v2=${{ github.workspace }}\vuka,github.com/vuka-lang/ui/v2=${{ github.workspace }}\vuka-ui,github.com/vuka-lang/web/v2=${{ github.workspace }}\vuka-web,github.com/vuka-lang/orm/v2=${{ github.workspace }}\vuka-orm
    steps:
      # The sources as committed: goldens and generated files compare bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vuka
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuka-lang/ui
          path: vuka-ui
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuka-lang/web
          path: vuka-web
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuka-lang/orm
          ref: 0baf7c839495ce48095ad8292876a4b679850f3a
          path: vuka-orm
      - name: The ui, web and orm branches of this change, if any
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for r in vuka-ui vuka-web vuka-orm; do
            git -C $r fetch --depth=1 origin "$BRANCH" && git -C $r checkout FETCH_HEAD || true
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            vuka/cmd/vuka/go.sum
            vuka-ui/go.sum
            vuka-web/go.sum
            vuka-orm/go.sum
      # The standalone CLI under its released name, as a Windows user gets it:
      # vuka finds it on PATH without a rename.
      - name: Tailwind
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/tailwindcss-windows-x64.exe" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-windows-x64.exe"
          cygpath -w "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The command builds with this repository's compiler and the ui checkout
        working-directory: vuka/cmd/vuka
        run: go mod edit -replace github.com/vuka-lang/vuka/v2=../.. -replace github.com/vuka-lang/ui/v2=../../../vuka-ui
      - name: vet
        working-directory: vuka/cmd/vuka
        run: go vet ./...
      # vuka new's app: vuka build, then vuka run -watch swapping in an edit;
      # vuka run -watch on a small app through builds that fail and that
      # change nothing; the platform's executables, process stops, shims,
      # paths and file watching. The rest of the suite assumes Unix tools
      # (shell-script stand-ins, Chrome over fds 3 and 4) or the Linux job's.
      - name: Module-root island paths on Windows
        working-directory: vuka
        run: go test -run '^TestResolveIslandPath$' ./toolchain/tsprops
      - name: vuka build and vuka run -watch
        working-directory: vuka/cmd/vuka
        run: >-
          go build -C ../.. -o "$RUNNER_TEMP/citest.exe" ./.github/scripts/citest &&
          "$RUNNER_TEMP/citest.exe" run -title "cmd/vuka on Windows" --
          -timeout 30m -run
          '^(TestNewRunWatch|TestRunWatch|TestBuildState.*|TestRunWatchReuse|TestReuseKey|TestReuseTrim|TestParseModFile|TestCutFresh|TestBuildDWARF|TestBinaryID|TestNoDWARF|TestCutWatch|TestWatcher.*|TestEmbedRoots|TestInterrupt|TestProcessAlive|TestRemoveAll|TestExeSuffix|TestNodeBin|TestFileURIPath|TestTailwindInstallHint|TestTailwindStandalone|TestTailwindBinary|TestDevFrontend|TestBuildFrontend|TestPrefixed|TestInstallCommand|TestFrontendDir)$' .

  extension:
    name: editors/vscode on ${{ matrix.os }} (tests, bundled TypeScript server)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cmd/vuka/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # vuka lsp from this repository, and gopls; no typescript-language-server
      # on PATH: the test runs the bundled one with this Node.
      - name: vuka and gopls
        run: |
          go install golang.org/x/tools/gopls@${GOPLS_VERSION}
          cd cmd/vuka
          go mod edit -replace github.com/vuka-lang/vuka/v2=../..
          go build -o "$RUNNER_TEMP/vuka$(go env GOEXE)" .
          echo "VUKA_BIN=$RUNNER_TEMP/vuka$(go env GOEXE)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - name: The VSIX bundles the server
        working-directory: editors/vscode
        run: |
          npx vsce ls | tee files.txt
          grep -qx 'node_modules/typescript-language-server/lib/cli.mjs' files.txt
          ! grep -q 'cli.mjs.map' files.txt

  fuzz:
    name: fuzz ${{ matrix.fuzz }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./transpile, fuzz: FuzzPackage }
          - { pkg: ./transpile, fuzz: FuzzSyntax }
          - { pkg: ./toolchain/format, fuzz: FuzzSource }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: transpile/testdata/golden/go.sum
      - run: go test -run '^$' -fuzz '^${{ matrix.fuzz }}$' -fuzztime 30s ${{ matrix.pkg }}
      - name: Keep the failing input
        if: failure()
        run: git ls-files --others --exclude-standard | grep '/testdata/fuzz/' | xargs -r tail -n +1
