<!-- The board. -->
<script   lang="go"  >
package board
import (
"context"
	"github.com/vuka-lang/ui/v2"
)
type Board struct{
	ui.Live
	rows []string
	open ui.State[bool]
	   }
@ui.Mount
func (b *Board) mount(ctx context.Context) error { b.rows = []string{"a"}; return nil }
func (b *Board) Add(text string) { b.rows = append(b.rows, text) }
</script>

      } else {

}

  }
  switch {
